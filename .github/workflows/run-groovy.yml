name: Run Groovy script

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Groovy script
        run: gradle --quiet --console=verbose --init-script scripts/main.groovy help
